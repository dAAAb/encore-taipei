name: Sync branch from agent bundle

# Updating .sync/request.json on this branch ({ url, branch, head }) fast-forwards `branch` to `head`
# from the git bundle at `url`, then redeploys Pages. Pushes are fast-forward only.
on:
  push:
    branches: [cursor/sync-0d54]
    paths: ['.sync/request.json']

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward target branch from bundle
        run: |
          url=$(jq -r .url .sync/request.json)
          target=$(jq -r .branch .sync/request.json)
          head=$(jq -r .head .sync/request.json)
          curl -fsSL --retry 5 "$url" -o "$RUNNER_TEMP/src.bundle"
          git bundle verify "$RUNNER_TEMP/src.bundle"
          git fetch "$RUNNER_TEMP/src.bundle" "+refs/heads/*:refs/remotes/bundle/*"
          test "$(git rev-parse "refs/remotes/bundle/$target")" = "$head"
          git push origin "$head:refs/heads/$target"
      - name: Redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

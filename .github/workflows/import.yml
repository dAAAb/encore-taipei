name: Import project (one-off)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge the project history from the build machine
        env:
          BUNDLE_URL: https://facial-prescribed-internationally-blog.trycloudflare.com/_import-1f3ca064a9b259f6c72bc843/src.bundle
        run: |
          if [ -f package.json ]; then echo "Already imported"; exit 0; fi
          curl -fsSL --retry 5 "$BUNDLE_URL" -o "$RUNNER_TEMP/src.bundle"
          git bundle verify "$RUNNER_TEMP/src.bundle"
          git fetch "$RUNNER_TEMP/src.bundle" main:refs/remotes/src/main
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"
          git merge --allow-unrelated-histories --no-edit -m "Import 台北安可之夜 project history" src/main
          git push origin HEAD:main

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Encore TV: every 10 minutes, rebuild only if the live channel list changed, so newly approved
  # channels get their share pages and screenshots quickly. Plus one daily refresh.
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BETA_BRANCH: cursor/encore-tv-0d54
  SUPABASE_URL: https://ogvqrfdgflxhfdqwtrxq.supabase.co
  SUPABASE_KEY: sb_publishable_Fe_h6sRUasUjh3jCuXkgKA_qtCRfwpM

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date -u +%H%M)" -lt "0010" ]; then
            echo build=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          norm='[.[] | {channel, title, url, author, message, og_image}] | sort_by(.channel)'
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url | sed 's#/*$##')
          live=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/encore_public_channels" \
            -H "apikey: $SUPABASE_KEY" -H 'Content-Type: application/json' -d '{}' | jq -cS "$norm") || live=error
          built=$(curl -fsS "$site/beta/channels.json?t=$(date +%s)" | jq -cS "$norm") || built=missing
          if [ "$live" = "$built" ]; then echo build=false; else echo build=true; fi >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Match both the default /encore-taipei/ URL and a custom domain at /.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # The beta never blocks the production deploy.
      - name: Check out beta
        id: beta-src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BETA_BRANCH }}
          path: beta-src
      # Stage screenshots for share images need CJK fonts on the runner (direct download: apt can stall).
      - name: Install CJK fonts
        if: steps.beta-src.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p ~/.local/share/fonts
          for w in Regular Bold Black; do
            curl -fsSL --retry 3 -o ~/.local/share/fonts/NotoSansCJKtc-$w.otf \
              "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-$w.otf"
          done
          fc-cache -f ~/.local/share/fonts
      - name: Build beta into /beta/
        if: steps.beta-src.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        working-directory: beta-src
        run: |
          npm ci
          npm run build
          rm -rf ../dist/beta
          cp -r dist ../dist/beta
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/beta/
          SITE_URL: ${{ steps.pages.outputs.base_url }}/beta
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

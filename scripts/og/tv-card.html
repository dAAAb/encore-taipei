<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=block">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0710; font-family: 'Noto Sans TC', sans-serif; }
  .bg { position: absolute; inset: -40px; background: url(../../public/og/2026.jpg) center/cover; filter: blur(14px) saturate(1.25) brightness(0.55); }
  .tint { position: absolute; inset: 0; background:
      radial-gradient(ellipse 70% 90% at 72% 50%, rgba(255, 70, 120, 0.18), transparent 60%),
      linear-gradient(90deg, rgba(8, 5, 14, 0.92) 0%, rgba(8, 5, 14, 0.7) 38%, rgba(8, 5, 14, 0.15) 70%, rgba(8, 5, 14, 0.35) 100%); }
  .grain { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 4px); mix-blend-mode: multiply; }

  .copy { position: absolute; left: 64px; top: 70px; width: 470px; color: #fff4d6; }
  .chip { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border-radius: 999px; background: #ffd400; color: #0c0812;
    font-weight: 900; font-size: 20px; letter-spacing: 0.22em; border: 3px solid #0c0812; box-shadow: 4px 4px 0 #0c0812; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff2a4d; box-shadow: 0 0 10px #ff2a4d; }
  h1 { margin: 26px 0 0; font-size: 84px; line-height: 1.02; font-weight: 900; letter-spacing: 0.04em; color: #fff4d6;
    text-shadow: 4px 4px 0 #c8234a, 8px 8px 0 #0c0812, 0 0 30px rgba(255, 60, 110, 0.55); }
  .sub { margin-top: 26px; font-size: 27px; line-height: 1.5; font-weight: 700; color: #ffe9a8; text-shadow: 2px 2px 0 #0c0812; }
  .chans { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .ch { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 13px; border-radius: 10px; background: rgba(12, 8, 18, 0.78);
    border: 2px solid rgba(182, 255, 176, 0.55); color: #fff; font-weight: 700; font-size: 18px; }
  .ch b { font: 900 19px ui-monospace, 'DejaVu Sans Mono', monospace; color: #b6ffb0; }
  .ch.next { border-style: dashed; border-color: rgba(255, 212, 0, 0.75); }
  .ch.next b { color: #ffd400; }

  .tv { position: absolute; right: 46px; top: 74px; width: 600px; height: 470px; border-radius: 46px;
    background: linear-gradient(160deg, #3a2a1c 0%, #22170f 55%, #150e09 100%); border: 5px solid #0c0812;
    box-shadow: 10px 12px 0 #0c0812, 0 30px 80px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.12); transform: rotate(1.6deg); }
  .screen { position: absolute; left: 30px; top: 28px; width: 540px; height: 372px; border-radius: 34px / 30px; overflow: hidden;
    background: url(../../public/og/2026.jpg) 66% 40%/auto 131% no-repeat #000; border: 4px solid #050307;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.75), 0 0 34px rgba(120, 170, 255, 0.35); }
  .screen::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px); }
  .screen::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 18%, rgba(255,255,255,0.22), transparent 42%),
      radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,0.55) 100%); }
  .osd { position: absolute; top: 18px; right: 24px; z-index: 2; font: 900 44px/1 ui-monospace, 'DejaVu Sans Mono', monospace; color: #b6ffb0;
    text-shadow: 0 0 14px rgba(90,255,130,0.8), 3px 3px 0 #000; }
  .live { position: absolute; left: 22px; bottom: 18px; z-index: 2; padding: 4px 12px; border-radius: 8px; background: rgba(0,0,0,0.7);
    color: #fff; font-weight: 900; font-size: 20px; border: 2px solid #ffd400; }
  .panel { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 0 40px; }
  .knob { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9b08a, #6b5236 70%); border: 3px solid #0c0812; }
  .led { width: 12px; height: 12px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 10px #ff3b3b; margin-right: auto; margin-left: 10px; }
  .grille { width: 120px; height: 20px; background: repeating-linear-gradient(90deg, #0c0812 0 4px, transparent 4px 9px); opacity: 0.7; border-radius: 4px; }
  .url { position: absolute; right: 52px; bottom: 26px; color: rgba(255, 244, 214, 0.75); font: 700 18px ui-monospace, monospace; letter-spacing: 0.18em; }
</style></head><body>
<div class="bg"></div><div class="tint"></div><div class="grain"></div>
<div class="copy">
  <span class="chip"><span class="dot"></span>ENCORE.TAIPEI</span>
  <h1>台北安可<br>電視台</h1>
  <p class="sub">一台老電視，轉台看每位市民<br>用 AI 做的台北安可舞台</p>
  <div class="chans">
    <span class="ch"><b>2026</b>台北安可之夜</span>
    <span class="ch"><b>2027</b>來生夜店</span>
    <span class="ch"><b>2028</b>大舞團</span>
    <span class="ch next"><b>NEXT</b>換你上台</span>
  </div>
</div>
<div class="tv">
  <div class="screen"><span class="osd">2026</span><span class="live">▶ 現正播放</span></div>
  <div class="panel"><span class="led"></span><span class="grille"></span><span class="knob"></span><span class="knob"></span></div>
</div>
</body></html>
